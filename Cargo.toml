[package]
name = "fts"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
prost = "0.13"
quinn = "0.11.12"
rcgen = "0.14.10"
rustls = "0.23.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tonic = "0.13"
uuid = { version = "1.27.0", features = ["v4"] }
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_NetworkManagement_WNet", "Win32_System_Console"] }

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
prost = "0.14"
protox = "0.9.1"
tonic-build = "0.13"
