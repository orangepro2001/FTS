<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fts 编排 server</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --fg:#e6e8ee; --dim:#8b93a7;
          --ok:#37d67a; --run:#4c9ffe; --bad:#ff5c5c; --warn:#ffb020; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header .sub { color:var(--dim); font-size:12px; }
  main { padding:20px 24px 60px; max-width:1180px; margin:0 auto; }
  h2 { font-size:14px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em;
       margin:26px 0 10px; font-weight:600; }
  table { width:100%; border-collapse:collapse; background:var(--card);
          border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th, td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--line);
           font-size:13px; }
  th { color:var(--dim); font-weight:600; background:#141821; }
  tr:last-child td { border-bottom:none; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px;
         background:var(--dim); }
  .dot.ok { background:var(--ok); } .dot.run { background:var(--run); }
  .dot.bad { background:var(--bad); } .dot.warn { background:var(--warn); }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size:12px; }
  button { background:#222836; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:7px 14px; cursor:pointer; font-size:13px; }
  button:hover { background:#2b3345; } button:disabled { opacity:.45; cursor:default; }
  button.primary { background:#2563eb; border-color:#2563eb; }
  button.primary:hover { background:#3b74f0; }
  form { background:var(--card); border:1px solid var(--line); border-radius:8px;
         padding:16px; display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  label { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--dim); }
  input, select { background:#0d1017; color:var(--fg); border:1px solid var(--line);
                  border-radius:6px; padding:7px 9px; font-size:13px; width:100%; }
  form .actions { grid-column:1/-1; display:flex; gap:10px; align-items:center; }
  .hint { color:var(--dim); font-size:12px; margin-left:auto; }
  .task { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:12px 14px; margin-bottom:10px; }
  .task .top { display:flex; align-items:center; gap:10px; }
  .task .name { font-weight:600; }
  .task .route { color:var(--dim); font-size:12px; }
  .task .state { margin-left:auto; font-size:12px; padding:2px 9px; border-radius:10px;
                 border:1px solid var(--line); }
  .state.RUNNING { color:var(--run); border-color:var(--run); }
  .state.COMPLETED { color:var(--ok); border-color:var(--ok); }
  .state.FAILED { color:var(--bad); border-color:var(--bad); }
  .state.CANCELLED { color:var(--warn); border-color:var(--warn); }
  .bar { height:9px; background:#0d1017; border:1px solid var(--line); border-radius:6px;
         margin-top:10px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--run); transition:width .3s; }
  .task.COMPLETED .bar > i { background:var(--ok); } .task.FAILED .bar > i { background:var(--bad); }
  .task.CANCELLED .bar > i { background:var(--warn); }
  .meta { color:var(--dim); font-size:12px; margin-top:7px; display:flex; gap:16px; flex-wrap:wrap; }
  .err { color:var(--bad); font-size:12px; margin-top:7px; }
  .warnline { color:var(--warn); font-size:12px; margin-top:4px; }
  .empty { color:var(--dim); font-size:13px; padding:10px 2px; }
</style>
</head>
<body>
<header>
  <h1>fts 编排 server</h1>
  <span class="sub">输入两端 → 探活 → 编排传输(源端 push,字节不经过本 server)</span>
</header>
<main>
  <h2>1 · 主机</h2>
  <table>
    <thead><tr>
      <th style="width:60px">名称</th><th>gRPC 地址</th><th style="width:90px">控制面</th>
      <th style="width:90px">数据面</th><th>数据地址</th><th>证书指纹</th><th>版本</th>
    </tr></thead>
    <tbody id="hosts"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
  </table>
  <div style="margin-top:10px; display:flex; gap:10px; align-items:center">
    <button id="checkBtn" class="primary">刷新探活</button>
    <span class="hint" id="checkHint"></span>
  </div>

  <h2>2 · 新建传输任务</h2>
  <form id="taskForm">
    <label>源主机 <select id="f_src" required></select></label>
    <label>源文件路径 <input id="f_src_path" placeholder="C:\data\payload.bin" required /></label>
    <label>目标主机 <select id="f_dst" required></select></label>
    <label>目标目录 <input id="f_dst_path" placeholder="D:\recv" required /></label>
    <label>传输层
      <select id="f_transport"><option value="">默认(auto)</option>
        <option value="auto">auto</option><option value="quic">quic</option>
        <option value="tcp">tcp</option></select>
    </label>
    <label>并行流数(0=默认4)<input id="f_streams" type="number" min="0" value="0" /></label>
    <label>分块字节(0=默认8MiB)<input id="f_chunk" type="number" min="0" value="0" /></label>
    <label style="justify-content:flex-end">
      <span></span>
      <span style="flex-direction:row; display:flex; align-items:center; gap:7px; color:var(--fg); font-size:13px">
        <input type="checkbox" id="f_purge" style="width:auto" />
        传输前清空目标目录(危险)
      </span>
    </label>
    <div class="actions">
      <button type="submit" class="primary" id="startBtn">开始传输</button>
      <span class="hint">可重复提交以做多任务并行测试(如 A1→B1 / A2→B2 / A3→B3)</span>
    </div>
  </form>

  <h2>3 · 任务</h2>
  <div id="tasks"><div class="empty">暂无任务</div></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
let hosts = [];

function dot(cls) { return `<span class="dot ${cls}"></span>`; }
function fmtBytes(n) {
  const u = ["B","KB","MB","GB","TB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + u[i];
}

async function loadHosts() {
  hosts = await (await fetch("/api/hosts")).json();
  const tb = $("#hosts");
  if (!hosts.length) { tb.innerHTML = '<tr><td colspan="7" class="empty">config 未配置主机</td></tr>'; return; }
  tb.innerHTML = hosts.map(h => {
    const ctl = h.control_ok ? dot("ok") + "通" : dot("bad") + "断";
    const dat = h.data_ok ? dot("ok") + "通" : (h.control_ok ? dot("warn") + "未知" : dot("bad") + "断");
    return `<tr>
      <td><b>${h.name}</b></td>
      <td class="mono">${h.grpc_addr}</td>
      <td>${ctl}</td><td>${dat}</td>
      <td class="mono">${h.data_addr || "-"}</td>
      <td class="mono">${h.fingerprint_short || "-"}</td>
      <td>${h.fts_version || "-"}${h.error ? `<div class="err">${h.error}</div>` : ""}</td>
    </tr>`;
  }).join("");
  fillSelect("#f_src"); fillSelect("#f_dst");
}

function fillSelect(sel) {
  const cur = $(sel).value;
  $(sel).innerHTML = hosts.map(h => `<option value="${h.name}">${h.name} (${h.grpc_addr})</option>`).join("");
  if (hosts.some(h => h.name === cur)) $(sel).value = cur;
}

async function checkHosts() {
  $("#checkBtn").disabled = true; $("#checkHint").textContent = "探活中…";
  try {
    hosts = await (await fetch("/api/hosts/check", { method: "POST" })).json();
    $("#checkHint").textContent = "完成";
    renderHosts();
  } catch (e) { $("#checkHint").textContent = "失败: " + e; }
  finally { $("#checkBtn").disabled = false; }
}

function renderHosts() {
  const tb = $("#hosts");
  tb.innerHTML = hosts.map(h => {
    const ctl = h.control_ok ? dot("ok") + "通" : dot("bad") + "断";
    const dat = h.data_ok ? dot("ok") + "通" : (h.control_ok ? dot("warn") + "未知" : dot("bad") + "断");
    return `<tr>
      <td><b>${h.name}</b></td><td class="mono">${h.grpc_addr}</td>
      <td>${ctl}</td><td>${dat}</td>
      <td class="mono">${h.data_addr || "-"}</td>
      <td class="mono">${h.fingerprint_short || "-"}</td>
      <td>${h.fts_version || "-"}${h.error ? `<div class="err">${h.error}</div>` : ""}</td>
    </tr>`;
  }).join("");
}

const tasks = new Map();
function renderTask(t) {
  tasks.set(t.id, t);
  const el = document.getElementById("task-" + t.id) || (() => {
    const d = document.createElement("div"); d.id = "task-" + t.id; d.className = "task";
    $("#tasks").querySelector(".empty")?.remove(); $("#tasks").appendChild(d); return d;
  })();
  el.className = "task " + t.state;
  const eta = t.eta_seconds != null ? `ETA ${t.eta_seconds}s` : "";
  const thr = t.throughput_bps ? fmtBytes(t.throughput_bps) + "/s" : "";
  const canCancel = t.state === "RUNNING" && t.source_task_id;
  el.innerHTML = `
    <div class="top">
      <span class="name">${t.name}</span>
      <span class="route">${t.src}:${t.src_path} → ${t.dst}:${t.dst_path}</span>
      <span class="state ${t.state}">${t.state}</span>
      <button data-cancel="${t.id}" ${canCancel ? "" : "disabled"}>取消</button>
    </div>
    <div class="bar"><i style="width:${t.percent}%"></i></div>
    <div class="meta">
      <span>${t.percent.toFixed(1)}%</span>
      <span>${fmtBytes(t.bytes_done)} / ${fmtBytes(t.bytes_total)}</span>
      <span>文件 ${t.files_done}/${t.files_total}${t.current_file ? " · " + t.current_file : ""}</span>
      <span>${thr}</span><span>${eta}</span>
      <span>${t.purge ? `purge: ${t.purge_files}文件/${t.purge_dirs}文件夹` : ""}</span>
      <span>${t.state === "COMPLETED" ? "checksum_ok=" + t.checksum_ok : ""}</span>
    </div>
    ${t.error_message && ["FAILED","CANCELLED"].includes(t.state)
        ? `<div class="err">${t.error}(${t.error_code}): ${t.error_message}</div>` : ""}
    ${(t.warnings || []).map(w => `<div class="warnline">~ ${w}</div>`).join("")}
  `;
  el.querySelector("[data-cancel]")?.addEventListener("click", async (e) => {
    e.target.disabled = true;
    await fetch(`/api/tasks/${t.id}/cancel`, { method: "POST" });
  });
}

$("#checkBtn").addEventListener("click", checkHosts);
$("#taskForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = {
    src: $("#f_src").value, src_path: $("#f_src_path").value,
    dst: $("#f_dst").value, dst_path: $("#f_dst_path").value,
    transport: $("#f_transport").value,
    streams: parseInt($("#f_streams").value) || 0,
    chunk_size: parseInt($("#f_chunk").value) || 0,
    purge: $("#f_purge").checked,
  };
  $("#startBtn").disabled = true;
  try {
    const r = await fetch("/api/tasks", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const t = await r.json();
    if (r.ok) renderTask(t); else alert("创建失败: " + (t.error || r.status));
  } finally { $("#startBtn").disabled = false; }
});

(async function init() {
  await loadHosts();
  (await (await fetch("/api/tasks")).json()).forEach(renderTask);
  const es = new EventSource("/api/events");
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "task_update") renderTask(ev.task);
    else if (ev.type === "host_update") {
      const i = hosts.findIndex(h => h.name === ev.host.name);
      if (i >= 0) { hosts[i] = ev.host; renderHosts(); }
    }
  };
})();
</script>
</body>
</html>
