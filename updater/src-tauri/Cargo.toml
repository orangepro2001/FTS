[package]
name = "fts-updater"
version = "0.1.0"
description = "fts 远程更新器:填 IP 一键推送新版 dist 并自替换重启"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 版本必须与主 crate 对齐(tonic/prost 复用 fts::grpc::pb 生成类型)
fts = { path = "../.." }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
tonic = "0.13"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
